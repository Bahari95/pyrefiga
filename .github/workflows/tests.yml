name: Installation and numerical tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install core dependencies and check metadata
        run: |
          python -m pip install dist/*.whl
          python -m pip check
      - name: Check installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/tests/test_installed_package.py"
      - name: Run numerical tests with the Python kernels
        run: python -m unittest discover -s pyrefiga/tests -p 'test_*.py' -v

  optional-features:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install compiler and optional dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python -m pip install '.[visualization,accelerate]'
          python -m pip check
      - name: Compile accelerated kernels
        run: python setup.py run_pyccel
      - name: Run numerical and export tests with accelerated kernels
        run: python -m unittest discover -s pyrefiga/tests -p 'test_*.py' -v
